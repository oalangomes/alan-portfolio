name: Refresh audited lockfile

on:
  push:
    branches:
      - chore/vite-modernization

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply safe audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No safe lockfile audit fixes available"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply safe npm audit fixes"
          git push
